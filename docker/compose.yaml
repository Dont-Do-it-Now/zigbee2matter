name: zigbee2matter

# MATTER_MDNS_NETWORKINTERFACE 는 빈 값이 NIC "" 로 해석될 수 있어 전달하지 않는다. 필요 시 environment 에 직접 추가한다.
# MATTER_MDNS_IPV4 기본 false 는 T039 결정(IPv6 link-local 우선, IPv4 mDNS 간섭 회피).
x-zigbee2matter-common: &zigbee2matter-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  network_mode: host
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  volumes:
    - zigbee2matter-data:/app/data
  environment:
    ZIGBEE2MATTER_DATA: /app/data
    ZIGBEE2MATTER_CONFIG_FRONTEND_ENABLED: "true"
    ZIGBEE2MATTER_CONFIG_FRONTEND_HOST: 0.0.0.0
    ZIGBEE2MATTER_CONFIG_FRONTEND_PORT: "8080"
    MATTER_MDNS_IPV4: ${MATTER_MDNS_IPV4:-false}

services:
  tcp:
    <<: *zigbee2matter-common
    profiles: [tcp]
    environment:
      ZIGBEE2MATTER_DATA: /app/data
      ZIGBEE2MATTER_CONFIG_FRONTEND_ENABLED: "true"
      ZIGBEE2MATTER_CONFIG_FRONTEND_HOST: 0.0.0.0
      ZIGBEE2MATTER_CONFIG_FRONTEND_PORT: "8080"
      ZIGBEE2MATTER_CONFIG_SERIAL_PORT: ${ZIGBEE2MATTER_SERIAL_PORT:?Set ZIGBEE2MATTER_SERIAL_PORT to tcp://host:port}
      ZIGBEE2MATTER_CONFIG_SERIAL_ADAPTER: ${ZIGBEE2MATTER_SERIAL_ADAPTER:?Set ZIGBEE2MATTER_SERIAL_ADAPTER for TCP coordinator}
      MATTER_MDNS_IPV4: ${MATTER_MDNS_IPV4:-false}

  usb:
    <<: *zigbee2matter-common
    profiles: [usb]
    devices:
      - ${ZIGBEE2MATTER_USB_DEVICE:?Set ZIGBEE2MATTER_USB_DEVICE to a host device path}:/dev/zigbee
    environment:
      ZIGBEE2MATTER_DATA: /app/data
      ZIGBEE2MATTER_CONFIG_FRONTEND_ENABLED: "true"
      ZIGBEE2MATTER_CONFIG_FRONTEND_HOST: 0.0.0.0
      ZIGBEE2MATTER_CONFIG_FRONTEND_PORT: "8080"
      ZIGBEE2MATTER_CONFIG_SERIAL_PORT: ${ZIGBEE2MATTER_SERIAL_PORT:-/dev/zigbee}
      MATTER_MDNS_IPV4: ${MATTER_MDNS_IPV4:-false}

volumes:
  zigbee2matter-data:
