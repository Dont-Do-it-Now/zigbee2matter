name: zigbee2matter

x-zigbee2matter-common: &zigbee2matter-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  network_mode: host
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  volumes:
    - zigbee2matter-data:/app/data
  environment:
    ZIGBEE2MQTT_DATA: /app/data
    ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
    ZIGBEE2MQTT_CONFIG_FRONTEND_HOST: 0.0.0.0
    ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: "8080"
    MATTER_MDNS_NETWORKINTERFACE: ${MATTER_MDNS_NETWORKINTERFACE:-}
    MATTER_MDNS_IPV4: ${MATTER_MDNS_IPV4:-false}

services:
  tcp:
    <<: *zigbee2matter-common
    profiles: [tcp]
    environment:
      ZIGBEE2MQTT_DATA: /app/data
      ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
      ZIGBEE2MQTT_CONFIG_FRONTEND_HOST: 0.0.0.0
      ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: "8080"
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: ${ZIGBEE2MQTT_SERIAL_PORT:?Set ZIGBEE2MQTT_SERIAL_PORT to tcp://host:port}
      ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: ${ZIGBEE2MQTT_SERIAL_ADAPTER:?Set ZIGBEE2MQTT_SERIAL_ADAPTER for TCP coordinator}
      MATTER_MDNS_NETWORKINTERFACE: ${MATTER_MDNS_NETWORKINTERFACE:-}
      MATTER_MDNS_IPV4: ${MATTER_MDNS_IPV4:-false}

  usb:
    <<: *zigbee2matter-common
    profiles: [usb]
    devices:
      - ${ZIGBEE2MQTT_USB_DEVICE:?Set ZIGBEE2MQTT_USB_DEVICE to a host device path}:/dev/zigbee
    environment:
      ZIGBEE2MQTT_DATA: /app/data
      ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
      ZIGBEE2MQTT_CONFIG_FRONTEND_HOST: 0.0.0.0
      ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: "8080"
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: ${ZIGBEE2MQTT_SERIAL_PORT:-/dev/zigbee}
      MATTER_MDNS_NETWORKINTERFACE: ${MATTER_MDNS_NETWORKINTERFACE:-}
      MATTER_MDNS_IPV4: ${MATTER_MDNS_IPV4:-false}

volumes:
  zigbee2matter-data:
