configuration:
  serial_device:
    name: Coordinator device
    description: Choose the detected USB/serial coordinator. Leave empty for automatic discovery or a network coordinator.
  serial_port:
    name: Manual port (advanced)
    description: Optional custom path or network port (tcp://host:port). The selected coordinator device takes precedence.
  serial_adapter:
    name: Adapter
    description: Coordinator adapter type. Required for tcp:// and when auto-discovery fails.
  matter_enabled:
    name: Enable Matter bridge
    description: Start the Matter bridge node.
  matter_mdns_interface:
    name: Matter mDNS interface
    description: Restrict mDNS to this network interface (e.g. enp0s3). Empty uses all non-internal interfaces.
  matter_ipv4:
    name: Matter IPv4 mDNS
    description: Also advertise over IPv4. Default is IPv6 only.
  matter_passcode:
    name: Commissioning passcode
  matter_discriminator:
    name: Commissioning discriminator
  matter_port:
    name: Matter UDP port
  api_enabled:
    name: Management API
    description: Enable the REST/WebSocket management API.
  api_host:
    name: API bind host
    description: Keep 127.0.0.1 unless the API is needed from the LAN. A token is required for non-loopback hosts.
  api_port:
    name: API port
  api_auth_token:
    name: API token
    description: Bearer token for the management API.
  frontend_auth_token:
    name: Frontend token
    description: Token required by the web UI on port 8080. The add-on uses host network, so without it the UI is reachable from the LAN without Home Assistant authentication.
  log_level:
    name: Log level
network:
  8080/tcp: Frontend
  8090/tcp: Management API
  5540/udp: Matter
