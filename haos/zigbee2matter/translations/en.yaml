configuration:
  serial_device:
    name: Zigbee coordinator device
    description: Select a Zigbee USB coordinator detected by Home Assistant OS before starting. For a network coordinator, use the manual port setting.
  serial_port:
    name: Manual port (advanced)
    description: Enter a custom path or network port (tcp://host:port). The selected dongle path takes precedence.
  serial_adapter:
    name: Adapter
    description: Coordinator adapter type. Required for tcp:// and when auto-discovery fails.
  matter_enabled:
    name: Enable Matter bridge
    description: Expose Zigbee devices to a Matter network. On by default.
  matter_passcode:
    name: Commissioning passcode
  matter_discriminator:
    name: Commissioning discriminator
  matter_port:
    name: Matter UDP port
  api_enabled:
    name: Management API
    description: Enable the REST/WebSocket management API.
  api_host:
    name: API bind host
    description: 127.0.0.1 allows Home Assistant internal access. To expose the API on your LAN, set 0.0.0.0 and provide an API token.
  api_port:
    name: API port
  api_auth_token:
    name: API token
    description: Set a Bearer token for LAN access to the management API. No default token is provided.
  frontend_auth_token:
    name: Frontend token
    description: Token required by the web UI on port 8080. The add-on uses host network, so without it the UI is reachable from the LAN without Home Assistant authentication.
  log_level:
    name: Log level
network:
  8080/tcp: Frontend
  8090/tcp: Management API
  5540/udp: Matter
