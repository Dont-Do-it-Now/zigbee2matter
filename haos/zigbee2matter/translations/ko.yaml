configuration:
  serial_device:
    name: Zigbee 코디네이터 장치
    description: HAOS에서 감지한 Zigbee USB 코디네이터를 선택해야 실행할 수 있습니다. 네트워크 코디네이터는 수동 포트 설정을 사용하세요.
  serial_port:
    name: 수동 포트(고급)
    description: 사용자 지정 경로나 네트워크 포트(tcp://host:port)를 입력합니다. 동글을 선택하면 동글 경로가 우선합니다.
  serial_adapter:
    name: 어댑터
    description: 코디네이터 어댑터 종류. tcp:// 이거나 자동 탐색이 실패하면 필수.
  matter_enabled:
    name: Matter 브리지 활성화
    description: Zigbee 장치를 Matter 네트워크에 노출합니다. 기본값은 켜짐입니다.
  matter_ipv4:
    name: Matter IPv4 광고
    description: Matter mDNS를 IPv4로도 광고합니다. 끄면 IPv4 광고만 꺼지고 IPv6 mDNS는 계속 사용합니다.
  matter_passcode:
    name: 커미셔닝 passcode
  matter_discriminator:
    name: 커미셔닝 discriminator
  matter_port:
    name: Matter UDP 포트
  api_enabled:
    name: 관리 API
    description: REST/WebSocket 관리 API 사용.
  api_host:
    name: API 바인드 호스트
    description: 기본값 127.0.0.1은 Home Assistant 내부 접근용입니다. LAN에 공개하려면 0.0.0.0과 API 토큰을 설정하세요.
  api_port:
    name: API 포트
  api_auth_token:
    name: API 토큰
    description: LAN에서 관리 API에 접근할 때 사용할 Bearer 토큰을 직접 지정하세요. 기본 토큰은 없습니다.
  frontend_auth_token:
    name: 프론트엔드 토큰
    description: 8080 포트 웹 UI 접근 토큰. host network 이므로 미설정 시 HA 인증 없이 LAN 에서 UI 에 접근할 수 있다.
  log_level:
    name: 로그 레벨
network:
  8080/tcp: Frontend
  8090/tcp: 관리 API
  5540/udp: Matter
