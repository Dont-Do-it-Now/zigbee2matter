# Release flow: bump package.json "version" only. This workflow builds and pushes the
# image for that version, then publish-version writes it to haos/zigbee2matter/config.yaml
# (the version Home Assistant advertises) so the store never points at a missing image tag.
name: Build Home Assistant app

on:
  push:
    branches: [main]
    paths:
      - "haos/zigbee2matter/**"
      - "haos/prepare-local.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "index.js"
      - "cli.js"
      - "lib/**"
      - "data/configuration.example.yaml"
      - ".github/workflows/haos-addon.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haos-addon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare add-on sources
        run: bash haos/prepare-local.sh
      - name: Read app metadata
        id: info
        uses: home-assistant/actions/helpers/info@58bff37c8947f690ace498be413a9b78d6f30f93
        with:
          path: ./haos/zigbee2matter
      - name: Normalize image name
        id: normalize
        env:
          IMAGE: ${{ steps.info.outputs.image }}
        run: |
          IMAGE=${IMAGE//\"/}
          VERSION=$(node -p "require('./package.json').version")
          echo "image_name=${IMAGE##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${IMAGE%/*}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare add-on sources
        run: bash haos/prepare-local.sh
      - name: Build and publish architecture image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./haos/zigbee2matter
          image: ${{ matrix.image }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.22
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          push: "true"
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-architecture image
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}

  publish-version:
    # Advertise the new version only after its image manifest exists.
    if: github.ref == 'refs/heads/main'
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Publish version to config.yaml
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            sed -i -E "s/^version: .*/version: \"${VERSION}\"/" haos/zigbee2matter/config.yaml
            if git diff --quiet; then
              echo "config.yaml already at ${VERSION}"
              exit 0
            fi
            git commit -am "chore(haos): publish ${VERSION}"
            git push origin HEAD:main && exit 0
            git reset --hard HEAD~1
            git pull --rebase origin main
          done
          exit 1
