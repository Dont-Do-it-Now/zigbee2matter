name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_gate:
        description: "Run the manually approved release preflight"
        required: true
        default: false
        type: boolean
      release_evidence:
        description: "Path to the phase evidence JSON"
        required: false
        default: ""
        type: string
      platform_gate:
        description: "Run the manually approved platform verification gate"
        required: true
        default: false
        type: boolean
      platform_evidence:
        description: "Path to the platform matrix evidence JSON"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.26.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: MQTT free gate
        run: node scripts/mqtt-free-gate.mjs --strict-test
      - name: Lockfile recovery contract
        run: node scripts/lockfile-recovery.mjs
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Static release and security gate
        run: node scripts/release-gate.mjs
      - name: Dependency audit
        run: pnpm audit --audit-level=critical
      - name: Biome check
        run: pnpm run check
      - name: Build
        run: pnpm run build
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Tests
        run: pnpm test
      - name: Fork tests
        run: pnpm run test:fork
      - name: Generate SBOM
        run: pnpm sbom --sbom-format cyclonedx --out bom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: bom.json

  upstream-ledger:
    name: upstream ledger (read-only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UPSTREAM_BASE_SHA: 3c841fdfd66c92239921ef84fde8f039c64e1662
      UPSTREAM_REF: main
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch upstream candidate
        run: |
          git remote add upstream https://github.com/Koenkk/zigbee2mqtt.git
          git fetch --no-tags upstream "${UPSTREAM_REF}"
      - name: Classify upstream diff
        run: >-
          node scripts/upstream-ledger.mjs
          --base "${UPSTREAM_BASE_SHA}"
          --candidate "$(git rev-parse "refs/remotes/upstream/${UPSTREAM_REF}")"
          --json --fail-on-review > upstream-ledger.json
      - name: Upload upstream ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-ledger-${{ github.sha }}
          path: upstream-ledger.json

  release-preflight:
    name: manually approved release preflight
    if: github.event_name == 'workflow_dispatch' && inputs.release_gate == true
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.26.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Validate release evidence
        env:
          RELEASE_EVIDENCE: ${{ inputs.release_evidence }}
        run: node scripts/release-gate.mjs --release "$RELEASE_EVIDENCE"
      - name: Install locked dependencies for release artifact
        run: pnpm install --frozen-lockfile
      - name: Generate release SBOM
        run: pnpm sbom --sbom-format cyclonedx --out bom.json
      - name: Upload release SBOM
        uses: actions/upload-artifact@v4
        with:
          name: release-sbom-${{ github.sha }}
          path: bom.json

  platform-preflight:
    name: manually approved platform verification
    if: github.event_name == 'workflow_dispatch' && inputs.platform_gate == true
    needs: quality
    runs-on: ubuntu-latest
    environment: platform-validation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate platform matrix evidence
        env:
          PLATFORM_EVIDENCE: ${{ inputs.platform_evidence }}
        run: node scripts/platform-matrix-gate.mjs --evidence "$PLATFORM_EVIDENCE"
