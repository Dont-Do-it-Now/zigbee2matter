# Zigbee2Matter configuration
#   Please stop Zigbee2Matter before editing this file, otherwise your changes will be overwritten.

# Indicates the configuration version (used by configuration migrations)
version: 5

# Home Assistant integration
homeassistant:
    enabled: false

# Enable the Matter bridge node (requires the configured Matter SDK runtime)
matter:
    enabled: false
    # passcode: 20202021
    # discriminator: 3840
    # attestation:
    #     mode: development
    #     vendorId: 65521
    #     productId: 32768
    # custom mode requires four user-owned certificate files and an acknowledged VID:
    #     mode: custom
    #     vendorId: 1234
    #     productId: 1
    #     vendorIdOwnershipAcknowledged: true
    #     dacPath: device.dac
    #     paiPath: product.pai
    #     cdPath: certification-declaration.der
    #     dacPrivateKeyPath: device.key
    # network:
    #     port: 5540
    #     mdnsInterface: eth0
    #     ipv4: true
    #     listeningAddressIpv4: 0.0.0.0
    #     listeningAddressIpv6: '::'

# Enable the frontend, runs on port 8080 by default
frontend:
    enabled: true
    # port: 8080

# Enable the local management REST/WebSocket API
api:
    enabled: true
    host: 127.0.0.1
    port: 8090
    # auth_token: !secret zigbee2matter_api_token
    # ssl_cert: /config/ssl/zigbee2matter.crt
    # ssl_key: /config/ssl/zigbee2matter.key

# Serial settings, only required when Zigbee2Matter fails to start with:
#   USB adapter discovery error (No valid USB adapter found).
#   Specify valid 'adapter' and 'port' in your configuration.
# serial:
#     # Location of the adapter
#     # USB adapters - use format "port: /dev/serial/by-id/XXX"
#     # Ethernet adapters - use format "port: tcp://192.168.1.12:6638"
#     port: /dev/serial/by-id/usb-Texas_Instruments_TI_CC2531_USB_CDC___0X00124B0018ED3DDF-if00
#     # Adapter type, allowed values: `zstack`, `ember`, `deconz`, `zigate` or `zboss`
#     adapter: zstack

# Periodically check whether devices are online/offline
# availability:
#     enabled: false

# Advanced settings
advanced:
    # channel: 11
    # Let Zigbee2Matter generate a network key on first start
    network_key: GENERATE
    # Let Zigbee2Matter generate a pan_id on first start
    pan_id: GENERATE
    # Let Zigbee2Matter generate a ext_pan_id on first start
    ext_pan_id: GENERATE
